name: telephony-contract
on:
  push:
    paths:
      - 'telephony/**'
      - '.github/workflows/telephony-contract.yml'
  pull_request:
    paths:
      - 'telephony/**'
      - '.github/workflows/telephony-contract.yml'
permissions:
  contents: read
jobs:
  free-switch-xml:
    name: Safe SIP routing XML and negative permission tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q telephony
      - name: Unit and negative security tests
        run: python -m unittest discover -s telephony/tests -v
