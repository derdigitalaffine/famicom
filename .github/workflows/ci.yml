name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r api/requirements.txt -r api/requirements-dev.txt
      - run: python -m pytest -q api/tests
      - run: python -m compileall -q api/app
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm install --no-audit --no-fund && npm run build
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/bootstrap.sh
      - run: cp .env.example .env && mkdir -p .secrets deploy/generated/prosody deploy/generated/freeswitch/directory deploy/generated/freeswitch/dialplan deploy/generated/freeswitch/sip_profiles && touch .secrets/xmpp_http .secrets/esl deploy/generated/Caddyfile deploy/generated/freeswitch/event_socket.conf.xml deploy/generated/freeswitch/switch.conf.xml deploy/generated/freeswitch/vars.xml
      - run: docker compose config --quiet
